<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifelike labels</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      background: #333;
    }
    acmi-lifelike-label > * {
      height: calc(100vh - 4rem);
    }
    figure {
      margin: 0;
      color: #ccc;
      font: 14px system-ui, sans-serif;
    }
    figcaption {
      margin-block-end: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- The same three-work playlist, drawn by each variant. With no
       playback-source the first item is current, the rest stack under it
       with no start times, and there is no timer. Served by flask, add
       playback-source="/api/playback-stream/" and they all come alive.
       The playlist is the one json island below, handed to every label.

       The nightmare room has no stream here either, so it waits — or runs,
       with ?timer — and data-harness-state puts it in a mode of its own. -->

  <figure>
    <figcaption>normal</figcaption>
    <acmi-lifelike-label variant="normal"></acmi-lifelike-label>
  </figure>

  <figure>
    <figcaption>playlist</figcaption>
    <acmi-lifelike-label variant="playlist"></acmi-lifelike-label>
  </figure>

  <figure>
    <figcaption>nightmare-room</figcaption>
    <acmi-lifelike-label variant="nightmare-room"></acmi-lifelike-label>
  </figure>

  <figure>
    <figcaption>nightmare-room, unavailable</figcaption>
    <acmi-lifelike-label variant="nightmare-room" data-harness-state="unavailable"></acmi-lifelike-label>
  </figure>

  <script type="importmap">
    {
      "imports": {
        "nanotags": "./vendor/nanotags.mjs",
        "nanostores": "./vendor/nanostores.mjs"
      }
    }
  </script>
  <script type="module">
    import "./main.mjs";

    const params = new URLSearchParams(location.search);

    // ?state=waiting, running, unavailable or closed puts the first
    // nightmare room in that mode. A run's ring needs ?timer too.
    const state = params.get("state");
    if (state) {
      document.querySelector('acmi-lifelike-label[variant="nightmare-room"]').dataset.harnessState = state;
    }

    const playlist = JSON.parse(document.getElementById("playlist").textContent);
    for (const label of document.querySelectorAll("acmi-lifelike-label")) {
      label.playlist = playlist;
      if (label.dataset.harnessState) label.firstElementChild.state = label.dataset.harnessState;
    }

    // With no stream, fake one: a 12 minute work, 42% through, so every
    // timer has something to draw — and the first nightmare room runs,
    // unless ?state says otherwise. Remove to see the no-timer states.
    const fake = params.has("timer");
    if (fake) {
      const start = performance.now();
      const durationMs = 720_000;
      function tick() {
        const position = ((performance.now() - start) / durationMs + 0.42) % 1;
        for (const label of document.querySelectorAll("acmi-lifelike-label > *")) {
          const remaining = Math.round((1 - position) * durationMs / 1000);
          const minutes = Math.floor(position * durationMs / 60000);
          const seconds = Math.floor(position * durationMs / 1000) % 60;
          label.timerRatio = position;
          label.timerElapsed = `${minutes}:${String(seconds).padStart(2, "0")}`;
          const room = label.localName === "acmi-nightmare-room";
          label.timerLine = `${room ? "Ends" : "Starts again"} in ${Math.max(1, Math.floor(remaining / 60))} minutes`;
          if (label.localName === "acmi-playlist-work") label.secondsUntilNext = remaining;
          if (room && !label.parentElement.dataset.harnessState) {
            label.state = "running";
          }
        }
        requestAnimationFrame(tick);
      }
      tick();
    }
  </script>
</body>
</html>
