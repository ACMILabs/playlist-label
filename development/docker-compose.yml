version: "3"

services:
  playlistlabel:
    build:
      context: "../"
      dockerfile: development/Dockerfile
      args:
        IS_LOCAL_ENV: "true"
    hostname: playlistlabel
    privileged: true
    container_name: playlistlabel
    # Not `env_file`: docker reads that once, when it creates the container.
    # The app reads config.env itself and restarts when it is saved, so an
    # edit needs no container restart. See app/dev_env.py.
    environment:
      CONFIG_ENV_FILE: /code/config.env
    volumes:
      - ../:/code
      - ../data:/data
    command: ./scripts/dev.sh
    ports:
     - 8081:8081
     # OSC from TouchOSC, for the nightmare room: keep it the same as OSC_PORT.
     - 9000:9000/udp
