version: '2'

volumes:
  settings:
  data:

services:
  browser:
    # Built from ./browser rather than pulled from a registry so we can layer in
    # socat and the debug startup script on top of the balena browser base image.
    build: ./browser
    container_name: browser
    privileged: true
    volumes:
      - 'settings:/data'
    environment:
      KIOSK: "1"
      SHOW_CURSOR: "0"
      ENABLE_GPU: "1"
      # Tells the balena browser base image to enable the Chrome DevTools Protocol
      # (CDP) on this internal port.  The debug startup script (run_debug.sh) then
      # proxies it out to the external port 9222 when DEBUG=true.
      REMOTE_DEBUG_PORT: "35173"
    ports:
      # Chrome DevTools Protocol — connect Chrome DevTools or Playwright here
      # when DEBUG=true.  socat inside the container forwards 9222 → 35173.
      - "9222:9222"
      # Direct CDP port (also exposed so tools that want the raw internal port
      # can connect without going through the socat proxy).
      - "35173:35173"
      - "5011:5011"

  playlist-label:
    container_name: book
    build: .
    ports:
      - "8081:801"
    privileged: true
    volumes:
      - 'data:/data'
    environment:
      - UDEV=1
      - TZ=Australia/Melbourne
    labels:
      io.balena.features.kernel-modules: '1'
      io.balena.features.firmware: '1'
      io.balena.features.dbus: '1'
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-api: '1'
      io.balena.features.sysfs: '1'
