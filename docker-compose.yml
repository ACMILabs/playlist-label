version: '2'

volumes:
  settings:
  data:

services:
  browser:
    # Built locally to add socat and the debug script to the balena browser image.
    build: ./browser
    container_name: browser
    privileged: true
    volumes:
      - 'settings:/data'
    environment:
      KIOSK: "1"
      SHOW_CURSOR: "0"
      ENABLE_GPU: "1"
      FORCE_VULKAN: "1"
      EXTRA_FLAGS: "--remote-allow-origins=*"
      # Chrome DevTools Protocol (CDP) on this internal port; run_debug.sh
      # proxies it out to 9222 when DEBUG=true.
      REMOTE_DEBUG_PORT: "35173"
    ports:
      # CDP through the socat proxy, when DEBUG=true.
      - "9222:9222"
      # CDP directly, without the proxy.
      - "35173:35173"
      - "5011:5011"

  playlist-label:
    container_name: book
    build: .
    ports:
      - "8081:801"
      - "8000:8000/udp"
    volumes:
      - 'data:/data'
    environment:
      - TZ=Australia/Melbourne
    # Unprivileged: scripts/pi.sh needs only the supervisor api, for the daily reboot.
    labels:
      io.balena.features.supervisor-api: '1'
